name: Basic CI Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Display Success Message
        run: echo "CI Pipeline is running successfully 🚀"

      - name: List Project Files
        run: ls -la