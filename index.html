<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Voting System - Login & Register</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-wrapper">
            <!-- Login Section -->
            <section id="login-section" class="auth-section active">
                <h1>E-Voting System</h1>
                <h2>Login</h2>
                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <input 
                            type="email" 
                            id="login-email" 
                            name="email" 
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input 
                            type="password" 
                            id="login-password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <p class="auth-toggle">
                    Don't have an account? 
                    <button type="button" class="toggle-btn" id="toggle-register">Register here</button>
                </p>
            </section>

            <!-- Register Section -->
            <section id="register-section" class="auth-section">
                <h1>E-Voting System</h1>
                <h2>Create Account</h2>
                <form id="register-form" class="auth-form">
                    <div class="form-group">
                        <label for="register-name">Full Name</label>
                        <input 
                            type="text" 
                            id="register-name" 
                            name="name" 
                            placeholder="Enter your full name"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email Address</label>
                        <input 
                            type="email" 
                            id="register-email" 
                            name="email" 
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input 
                            type="password" 
                            id="register-password" 
                            name="password" 
                            placeholder="Enter a strong password"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="register-confirm-password">Confirm Password</label>
                        <input 
                            type="password" 
                            id="register-confirm-password" 
                            name="confirm-password" 
                            placeholder="Confirm your password"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="register-voter-id">Voter ID</label>
                        <input 
                            type="text" 
                            id="register-voter-id" 
                            name="voter-id" 
                            placeholder="Enter your voter ID"
                            required
                        >
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
                <p class="auth-toggle">
                    Already have an account? 
                    <button type="button" class="toggle-btn" id="toggle-login">Login here</button>
                </p>
            </section>
        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
