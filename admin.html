<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Voting System - Admin Results</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <nav class="nav-container">
            <h1 class="nav-brand">E-Voting System - Admin Panel</h1>
            <ul class="nav-menu">
                <li><span id="admin-name" class="user-info"></span></li>
                <li><button id="admin-logout-btn" class="btn btn-secondary">Logout</button></li>
            </ul>
        </nav>
    </header>

    <main class="admin-container">
        <div id="access-denied" class="alert alert-error hidden" role="alert" style="margin: 2rem; text-align: center;">
            <h2>Access Denied</h2>
            <p>You do not have permission to access the admin panel. Only administrators can view this page.</p>
            <button onclick="window.location.href='vote.html'" class="btn btn-primary" style="margin-top: 1rem;">Return to Voting Page</button>
        </div>
        <div id="admin-content" class="admin-wrapper">
            <section class="results-header">
                <h2>Election Results</h2>
                <div class="results-stats">
                    <div class="stat-card">
                        <h4>Total Votes</h4>
                        <p id="total-votes" class="stat-number">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>Voting Status</h4>
                        <p id="voting-status" class="stat-text">Active</p>
                    </div>
                </div>
            </section>

            <section class="results-section">
                <div class="results-header-actions">
                    <h3>Candidate Results</h3>
                    <button id="refresh-results-btn" class="btn btn-primary btn-sm">🔄 Auto-Refresh</button>
                </div>
                <div class="table-responsive">
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>Candidate Name</th>
                                <th>Party</th>
                                <th>Vote Count</th>
                                <th>Percentage</th>
                            </tr>
                        </thead>
                        <tbody id="results-table-body">
                            <!-- Results will be loaded here by JavaScript -->
                        </tbody>
                    </table>
                </div>
                <div id="results-container" class="results-container hidden">
                    <!-- Fallback card display if needed -->
                </div>
            </section>

            <section class="results-chart">
                <h3>Vote Distribution</h3>
                <canvas id="results-chart" width="400" height="200"></canvas>
            </section>

            <section class="admin-actions">
                <button id="export-results-btn" class="btn btn-secondary">Export Results</button>
                <button id="start-voting-btn" class="btn btn-success">Start Voting</button>
                <button id="end-voting-btn" class="btn btn-danger">End Voting</button>
            </section>

            <div id="admin-message" class="alert hidden">
                <p id="admin-message-text"></p>
            </div>
        </div>
        </div>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
